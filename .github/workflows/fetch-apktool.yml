name: Fetch Apktool
on:
  push:
    paths:
      - '.github/workflows/fetch-apktool.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download apktool
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          sha256sum apktool.jar
      - name: Upload apktool
        uses: actions/upload-artifact@v4
        with:
          name: apktool-3.0.3
          path: apktool.jar
