name: Observe original Android playback without a phone
on:
  push:
    branches: [codex/palma-windows-v3-draft-20261022]
    paths: ['palma-core/tools/probe-original-android.py', '.github/workflows/probe-original-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: palma-original-android-reference
  cancel-in-progress: true
jobs:
  original-android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download exact original release APKs
        run: |
          mkdir -p palma-core/probe-input
          curl --fail --location --retry 2 https://github.com/Oscar-TV/apk/releases/download/v1.1.6/OscarTV.apk --output palma-core/probe-input/OscarTV.apk
          curl --fail --location --retry 2 https://github.com/Oscar-TV/apk/releases/download/v1.1.6/TDM.apk --output palma-core/probe-input/TDM.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe unmodified source application
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 palma-core/tools/probe-original-android.py
      - name: Preserve sanitized UI observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-android-reference
          path: palma-core/probe-output/original-android/*
          if-no-files-found: warn
          retention-days: 14
