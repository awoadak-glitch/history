name: Build MX PALMA resolver bridge
on:
  push:
    paths:
      - '.github/workflows/build-mx-palma-bridge.yml'
permissions:
  contents: read
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;35.0.0'
      - name: Recreate and compile bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/mxbridge dist/mxbridge
          mkdir -p build/mxbridge/src/com/mxtech/videoplayer/ad build/mxbridge/classes build/mxbridge/dex dist/mxbridge
          echo '' | base64 -d | gzip -d > build/mxbridge/src/com/mxtech/videoplayer/ad/PalmaResolverActivity.java
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          javac --release 8 -encoding UTF-8 -cp "$ANDROID_JAR" -d build/mxbridge/classes build/mxbridge/src/com/mxtech/videoplayer/ad/PalmaResolverActivity.java
          (cd build/mxbridge/classes && jar cf ../bridge.jar .)
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 23 --lib "$ANDROID_JAR" --output build/mxbridge/dex build/mxbridge/bridge.jar
          cp build/mxbridge/dex/classes.dex dist/mxbridge/classes11.dex
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/mxbridge/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" dist/mxbridge/zipalign
          chmod +x dist/mxbridge/zipalign
          sha256sum dist/mxbridge/* > dist/mxbridge/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mx-palma-resolver-bridge
          path: dist/mxbridge/
          if-no-files-found: error
          retention-days: 30
