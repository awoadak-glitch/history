name: Package sanitized phone playback collector
on:
  push:
    branches: [codex/palma-windows-v3-draft-20261022]
    paths:
      - 'palma-core/tools/phone-reference/**'
      - '.github/workflows/package-phone-reference.yml'
permissions:
  contents: read
jobs:
  collector:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify PowerShell 5.1 parsing and secret removal
        shell: powershell
        run: '& ./palma-core/tools/phone-reference/Collect-Phone-Playback.ps1 -SelfTest'
      - name: Verify PowerShell 7 parsing and secret removal
        shell: pwsh
        run: '& ./palma-core/tools/phone-reference/Collect-Phone-Playback.ps1 -SelfTest'
      - name: Package diagnostic helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path collector-output | Out-Null
          Compress-Archive -Path palma-core/tools/phone-reference/* -DestinationPath collector-output/PALMA-Phone-Playback-Diagnostic.zip
          (Get-FileHash collector-output/PALMA-Phone-Playback-Diagnostic.zip -Algorithm SHA256).Hash.ToLower() | Set-Content collector-output/PALMA-Phone-Playback-Diagnostic.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PALMA-Phone-Playback-Diagnostic
          path: collector-output/*
          if-no-files-found: error
